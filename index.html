<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>留一盏灯 · 互动影游</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="grain"></div>

<div id="stage">
  <video id="player" playsinline preload="auto" poster="assets/poster.jpg"></video>

  <!-- 顶部信息条 -->
  <header class="chrome" id="chrome">
    <div class="brand">
      <span class="dot"></span>
      <span class="name">留一盏灯</span>
      <span class="sep">/</span>
      <span class="kind">互动影游</span>
    </div>
    <div class="right">
      <button class="ghost" id="btnSpeed">1.0×</button>
      <button class="ghost" id="btnMute">🔊</button>
      <button class="ghost" id="btnSkip">跳过片头</button>
    </div>
  </header>

  <!-- 标题页 -->
  <section class="veil show" id="titleCard">
    <div class="titleInner">
      <div class="eyebrow">A SHORT INTERACTIVE FILM</div>
      <h1>留一盏灯</h1>
      <p class="log">深夜，小店要打烊了。<br>窗外有人借着店里的光，在读一封信。</p>
      <button class="cta" id="btnStart"><span>开始</span></button>
      <div class="hint">建议开启声音 · 全程约 40 秒</div>
      <div class="loading" id="loadState" hidden>正在载入影片…</div>
    </div>
  </section>

  <!-- 选择节点 -->
  <section class="veil" id="choiceCard">
    <div class="choiceInner">
      <div class="qmark">这一刻，你怎么做？</div>
      <div class="options">
        <button class="opt" data-branch="a">
          <span class="k">A</span>
          <span class="t">把灯留着</span>
          <span class="d">不作声，让光继续照着他</span>
        </button>
        <button class="opt" data-branch="b">
          <span class="k">B</span>
          <span class="t">关灯，出去看看</span>
          <span class="d">推开门，走到他身边</span>
        </button>
      </div>
      <div class="hint">点选后进入对应结局 · 随时可返回重选</div>
    </div>
  </section>

  <!-- 结局 -->
  <section class="veil" id="endCard">
    <div class="endInner">
      <div class="eyebrow" id="endTag">ENDING A</div>
      <h2 id="endTitle">灯亮了一整夜</h2>
      <p class="log" id="endLine"></p>
      <div class="endBtns">
        <button class="cta" id="btnAgain"><span>回到分岔口</span></button>
        <button class="ghost big" id="btnReplay">重看这一段</button>
      </div>
    </div>
  </section>

  <!-- 底部进度 -->
  <footer class="bar" id="bar">
    <div class="track"><i id="fill"></i></div>
    <div class="marks">
      <span id="chapter">开场</span>
      <span id="time">00:00 / 00:12</span>
    </div>
  </footer>
</div>

<script>
const V = document.getElementById('player')
const titleCard = document.getElementById('titleCard')
const choiceCard = document.getElementById('choiceCard')
const endCard = document.getElementById('endCard')
const chrome = document.getElementById('chrome')
const bar = document.getElementById('bar')
const fill = document.getElementById('fill')
const timeEl = document.getElementById('time')
const chapterEl = document.getElementById('chapter')
const btnSpeed = document.getElementById('btnSpeed')
const btnMute = document.getElementById('btnMute')
const btnSkip = document.getElementById('btnSkip')
const endTag = document.getElementById('endTag')
const endTitle = document.getElementById('endTitle')
const endLine = document.getElementById('endLine')
const loadState = document.getElementById('loadState')

const SRC = { open: 'assets/open.mp4', a: 'assets/a.mp4', b: 'assets/b.mp4' }
const LABEL = { open: '开场', a: '分支 A · 把灯留着', b: '分支 B · 关灯出去' }
const SPEEDS = [1, 1.25, 1.5, 0.75]
let speedIdx = 0
let state = 'title'          // title | open | choosing | branch | end
let current = null

// 预载分支，避免点选后等待
const preload = ['a', 'b'].map(k => {
  const v = document.createElement('video')
  v.src = SRC[k]; v.preload = 'auto'; v.muted = true
  return v
})

function fmt(s) {
  if (!isFinite(s)) return '00:00'
  const m = Math.floor(s / 60), x = Math.floor(s % 60)
  return `${String(m).padStart(2, '0')}:${String(x).padStart(2, '0')}`
}

function show(el) { el.classList.add('show') }
function hide(el) { el.classList.remove('show') }
function hideAllVeils() { [titleCard, choiceCard, endCard].forEach(hide) }

function play(key) {
  current = key
  V.src = SRC[key]
  V.playbackRate = SPEEDS[speedIdx]
  V.muted = muted
  V.play().catch(() => { V.muted = true; V.play().catch(() => {}) })
  chapterEl.textContent = LABEL[key]
  loadState.hidden = false
  state = key === 'open' ? 'open' : 'branch'
}

function toChoice() {
  if (state === 'choosing') return
  state = 'choosing'
  V.pause()
  show(choiceCard)
  chapterEl.textContent = '选择'
}

document.getElementById('btnStart').addEventListener('click', () => {
  hide(titleCard)
  play('open')
})

V.addEventListener('timeupdate', () => {
  const d = V.duration || 0
  fill.style.width = d ? `${(V.currentTime / d) * 100}%` : '0%'
  timeEl.textContent = `${fmt(V.currentTime)} / ${fmt(d)}`
  if (state === 'open' && d && V.currentTime >= d - 0.35) toChoice()
})

V.addEventListener('playing', () => { loadState.hidden = true })
V.addEventListener('waiting', () => { loadState.hidden = false })
V.addEventListener('ended', () => {
  if (state === 'open') toChoice()
  else if (state === 'branch') showEnd()
})

document.querySelectorAll('.opt').forEach(btn => {
  btn.addEventListener('click', () => {
    const br = btn.dataset.branch
    hideAllVeils()
    play(br)
  })
})

function showEnd() {
  state = 'end'
  const isA = current === 'a'
  endTag.textContent = isA ? 'ENDING A' : 'ENDING B'
  endTitle.textContent = isA ? '灯亮了一整夜' : '灯又亮了'
  endLine.innerHTML = isA
    ? '她没有关灯。<br>那盏灯留到天亮，信读完了，老人朝店里轻轻点了下头。'
    : '她关了灯，走出去。<br>后来灯又亮了——这一次，是让两个人坐着把信读完。'
  show(endCard)
  V.pause()
}

document.getElementById('btnAgain').addEventListener('click', () => {
  hideAllVeils()
  V.currentTime = 0
  toChoice()
})
document.getElementById('btnReplay').addEventListener('click', () => {
  hideAllVeils()
  play(current)
})

// 控制条
btnSpeed.addEventListener('click', () => {
  speedIdx = (speedIdx + 1) % SPEEDS.length
  V.playbackRate = SPEEDS[speedIdx]
  btnSpeed.textContent = SPEEDS[speedIdx].toFixed(2).replace(/0$/, '') + '×'
})
let muted = false
btnMute.addEventListener('click', () => {
  muted = !muted
  V.muted = muted
  btnMute.textContent = muted ? '🔇' : '🔊'
})
btnSkip.addEventListener('click', () => {
  if (state === 'title') return
  toChoice()
})

// 播放中自动隐藏控件
let idle
function bumpIdle() {
  chrome.classList.remove('hide'); bar.classList.remove('hide')
  clearTimeout(idle)
  idle = setTimeout(() => {
    if (state === 'open' || state === 'branch') {
      chrome.classList.add('hide'); bar.classList.add('hide')
    }
  }, 3200)
}
document.addEventListener('mousemove', bumpIdle)
document.addEventListener('touchstart', bumpIdle)
document.addEventListener('keydown', e => {
  if (e.code === 'Space') {
    e.preventDefault()
    if (state === 'open' || state === 'branch') {
      V.paused ? V.play() : V.pause()
    }
  }
  if (state === 'choosing' && (e.key === '1' || e.key === 'a')) document.querySelector('.opt[data-branch="a"]').click()
  if (state === 'choosing' && (e.key === '2' || e.key === 'b')) document.querySelector('.opt[data-branch="b"]').click()
  if (state === 'end' && e.key.toLowerCase() === 'r') document.getElementById('btnReplay').click()
})
bumpIdle()

</script>
</body>
</html>
